name: CI

# Deterministic gates on every push to main and every pull request. Before this file the
# repository had only release.yml, so a broken commit sat on main until someone tagged it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and gates (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Drift test
        run: npm run drift

      - name: Provenance test
        run: npm run provenance

      - name: Security test
        run: npm run security
